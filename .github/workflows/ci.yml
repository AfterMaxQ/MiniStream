name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CMake
        run: python -m pip install cmake==3.31.6
      - name: Configure
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DMINISTREAM_BUILD_UI=OFF
          -DMINISTREAM_BUILD_TOOLS=OFF
          -DMINISTREAM_BUILD_TESTS=ON
      - name: Build tests
        run: cmake --build build --config Release --target ministream_tests --parallel 4
      - name: Run C++ tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Run repository contract tests
        run: |
          python tests/ci/workflow_contract_test.py
          python tests/ui/role_shell_copy_test.py
          python tests/ui/shortcut_policy_test.py
          python tests/packaging/packaging_contract_test.py
          python tests/packaging/version_contract_test.py

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CMake
        run: python -m pip install cmake==3.31.6
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.2"
          cache: true
      - name: Install libsodium
        run: brew install libsodium
      - name: Configure
        shell: bash
        run: |
          SODIUM_PREFIX="$(brew --prefix libsodium)"
          cmake -S . -B build -G Xcode \
            -DMINISTREAM_BUILD_UI=OFF \
            -DMINISTREAM_BUILD_TOOLS=OFF \
            -DMINISTREAM_BUILD_TESTS=ON \
            -DMINISTREAM_SODIUM_INCLUDE_DIR="$SODIUM_PREFIX/include" \
            -DMINISTREAM_SODIUM_LIBRARY="$SODIUM_PREFIX/lib/libsodium.dylib"
      - name: Build tests
        run: cmake --build build --config Release --target ministream_tests --parallel 4
      - name: Run C++ tests
        run: ctest --test-dir build -C Release --output-on-failure
